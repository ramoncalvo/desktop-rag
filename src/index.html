<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen">
    <div class="setup-card">
      <h1>RAG App</h1>
      <p class="subtitle">Configuracion inicial</p>
      <div id="setup-status" class="status">Verificando Ollama...</div>
      <div class="progress-bar"><div id="setup-progress" class="progress-fill"></div></div>
      <div class="form-row">
        <label>Modelo:</label>
        <select id="model-select">
          <option value="llama3.1:8b" selected>llama3.1:8b</option>
          <option value="llama3.2:3b">llama3.2:3b</option>
          <option value="mistral:7b">mistral:7b</option>
          <option value="gemma2:9b">gemma2:9b</option>
          <option value="qwen2.5:7b">qwen2.5:7b</option>
        </select>
      </div>
      <div class="btn-row">
        <button id="setup-btn" class="btn primary">Iniciar</button>
      </div>
      <div id="setup-detail" class="detail"></div>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="screen hidden">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Sesiones</h2>
        <button id="new-session-btn" class="btn small">+ Nuevo</button>
      </div>
      <ul id="sessions-list"></ul>
    </aside>

    <!-- Content -->
    <main id="content">
      <!-- Tabs -->
      <nav class="tabs">
        <button class="tab active" data-tab="chat">Chat</button>
        <button class="tab" data-tab="indexer">Fuentes</button>
      </nav>

      <!-- Chat Tab -->
      <div id="tab-chat" class="tab-content active">
        <div id="messages"></div>
        <div class="input-area">
          <textarea id="chat-input" placeholder="Escribe tu pregunta..." rows="3"></textarea>
          <div class="input-buttons">
            <button id="send-btn" class="btn primary">Enviar</button>
            <button id="cancel-btn" class="btn" disabled>Cancelar</button>
          </div>
        </div>
      </div>

      <!-- Indexer Tab -->
      <div id="tab-indexer" class="tab-content">
        <div class="indexer-section">
          <h3>Carpeta de documentos</h3>
          <div class="folder-row">
            <input id="folder-path" type="text" readonly placeholder="Selecciona una carpeta..." />
            <button id="browse-btn" class="btn">Seleccionar</button>
          </div>
          <div class="btn-row">
            <button id="index-btn" class="btn primary">Escanear e indexar nuevos</button>
          </div>
          <div id="index-status" class="status"></div>
        </div>

        <div class="indexer-section">
          <h3>Archivos indexados</h3>
          <table id="files-table">
            <thead>
              <tr><th>Titulo</th><th>Tipo</th><th>Chunks</th><th></th></tr>
            </thead>
            <tbody id="files-body"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Status bar -->
    <footer id="status-bar">
      <span id="status-text">Conectando...</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
